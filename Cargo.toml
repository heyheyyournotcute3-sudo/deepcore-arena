[workspace]
resolver = "3"
members = [
    "crates/shared",
    "crates/server",
    "crates/client",
    "tools/atlas_gen",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/heyheyyournotcute3-sudo/deepcore-arena"

# Pinned exactly: the Bevy ecosystem breaks its API every release.
# Verified against crates.io on 2026-12-06:
#   bevy 0.20.1 <- bevy_replicon 0.45.5 (dep: bevy ^0.20)
#              <- bevy_replicon_renet 0.21.0 (dep: bevy ^0.20)
#              <- bevy_egui 0.43.1 (deps: bevy_* ^0.20.0)
[workspace.dependencies]
bevy = { version = "=0.20.1", default-features = false }
bevy_replicon = "=0.45.5"
bevy_replicon_renet = "=0.21.0"
bevy_egui = "=0.43.1"

serde = { version = "=1.0.228", features = ["derive"] }
ron = "=0.12.3"
postcard = { version = "=1.1.3", features = ["alloc"] }
noise = "=0.9.0"
rand = "=0.9.2"
rand_chacha = "=0.10.0"
zstd = "=0.14.3"
tracing = "=0.1.41"
thiserror = "=2.0.17"
bytemuck = { version = "=1.24.0", features = ["derive"] }

deepcore-shared = { path = "crates/shared" }

# Dev-only dynamic linking for Bevy, per prompt. Harmless when unused.
[workspace.lints.clippy]
# Correctness-adjacent lints, enforced as errors by scripts/check.sh.
unwrap_used = "warn"
expect_used = "warn"
# Bevy queries and systems are naturally complex / have many params.
type_complexity = "allow"
too_many_arguments = "allow"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
