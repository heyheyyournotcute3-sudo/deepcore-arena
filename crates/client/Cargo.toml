[package]
name = "deepcore-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "client"
path = "src/main.rs"

[dependencies]
bevy = { workspace = true, features = [
    "multi_threaded",
    "bevy_log",
    "bevy_pbr",
    "bevy_winit",
    "bevy_core_pipeline",
    "bevy_asset",
    "bevy_render",
    "bevy_ui",
    "bevy_ui_render",
    "bevy_text",
    "default_font",
    "x11",
    "png",
    "tonemapping_luts",
    "zstd_rust",
    "std",
    "debug",
] }
deepcore-shared = { workspace = true }
bevy_replicon = { workspace = true }
bevy_replicon_renet = { workspace = true }
serde = { workspace = true }
postcard = { workspace = true }
tracing = { workspace = true }

[lints]
workspace = true
